# mpv-getsub-lua config — copy to ~/.config/mpv/script-opts/mpv-getsub-lua.conf
provider=opensubtitles
languages=en,sr,hr
# OpenSubtitles REST API key identifying this app (register at opensubtitles.com/consumers)
api_key=YOUR_APP_API_KEY
# Optional: your own account, to use your own download quota instead of the app's
username=
password=
save_to=video
auto_select=no
osd_duration_ms=8000
